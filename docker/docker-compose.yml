version: '3.8'

x-app-vars: &app-vars
  NODE_ENV: ${NODE_ENV:-development}
  PORT: 3001
  DATABASE_URL: postgresql://arom_user:arom_pass@postgres:5432/arom_studio
  REDIS_URL: redis://redis:6379
  ADMIN_PASSWORD: ${ADMIN_PASSWORD}
  ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
  CORS_ORIGIN: http://localhost:5173,http://localhost:3001
  BACKUP_ENABLED: 'false'
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arom_user
      POSTGRES_PASSWORD: arom_pass
      POSTGRES_DB: arom_studio
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arom_user -d arom_studio']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/production.Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *app-vars
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  migrate:
    build:
      context: ..
      dockerfile: docker/production.Dockerfile
    command: npx prisma migrate deploy --schema=server/prisma/schema.prisma
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-vars
    restart: 'no'

volumes:
  pgdata:
